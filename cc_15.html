<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Line | Risk Management Dashboard</title>
    <link rel="stylesheet" href="cc_15.css">
</head>
<body>
    <header>
        <h1>Intelligent Line</h1>
        <p>Risk Management Dashboard</p>
    </header>
    <main>
        <!--Task 1-->
        <div id="riskDashboard"></div>
        <form id="riskForm">
            <label for="risk">Risk Description:</label>
            <input type="text" id="risk" name="risk" required>

            <label for="riskLevel">Risk Level:</label>
            <select id="riskLevel" name="riskLevel" required>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <label for="riskDepartment">Department:</label>
            <input type="text" id="riskDepartment" name="riskDepartment" required>

            <button type="submit">Add Risk</button>

        </form>
        <!--Task 5-->
        <button id="increaseRisk">Increase Risk Levels</button>
    </main>
    <footer>
        <p>© 2025 Intelligent Line. All Rights Reserved</p>
    </footer>
    <script src="cc_15.js"></script>
</body>
</html>
